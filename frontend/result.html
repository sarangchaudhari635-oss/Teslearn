<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <title>Result — TesLearn</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/comic-book.js"></script>
</head>
<body>
  <div class="mesh-bg" aria-hidden="true"></div>
  <div class="shell content">
    <div id="nav"></div>

    <header style="margin-bottom:1.25rem">
      <p class="kicker" id="kicker">Result</p>
      <h1 class="title-lg" id="title" style="margin-top:0.35rem">Topic</h1>
    </header>

    <div class="card result-frame" id="box"></div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script>
    UI.mountNav({ backHref: 'resources.html', showHistory: false });

    const r = Store.result;
    const topic = Store.topic;
    if (!r?.type || !topic) location.href = 'index.html';

    document.getElementById('title').textContent = r.title || topic;
    const box = document.getElementById('box');
    const kicker = document.getElementById('kicker');

    const embedFrame = (url, title, playerClass = 'video-player') => `
      <div class="${playerClass}" id="embedPlayer">
        <iframe src="${url}" allow="autoplay; fullscreen" allowfullscreen title="${title}"></iframe>
        <button type="button" class="embed-fs-btn" id="embedFsBtn" aria-label="Enter fullscreen">
          ⛶ Fullscreen
        </button>
      </div>`;

    switch (r.type) {
      case 'video':
        kicker.textContent = 'Video';
        box.innerHTML = embedFrame(r.embed_url, 'Video player', 'video-player');
        setupEmbedFullscreen();
        break;
      case 'podcast':
        kicker.textContent = 'Podcast';
        box.className = 'card result-frame podcast-result';
        box.innerHTML = `
          <div class="podcast-player">
            <img src="podcast_result.png" alt="" class="podcast-thumb" />
            <div class="podcast-audio-wrap">
              <audio controls src="${r.audio_url}"></audio>
            </div>
          </div>`;
        break;
      case 'mindmap':
        kicker.textContent = 'Mindmap';
        box.innerHTML = `<iframe src="${r.html_url}" title="Mindmap"></iframe>`;
        break;
      case 'lab':
        kicker.textContent = 'Virtual Lab';
        box.innerHTML = embedFrame(r.html_url, 'Virtual Lab', 'embed-player');
        setupEmbedFullscreen();
        break;
      case 'notes':
        kicker.textContent = 'Notes';
        box.innerHTML = `<article class="markdown-body">${MD.render(r.markdown || '')}</article>`;
        MD.typeset(box.querySelector('.markdown-body'));
        break;
      case 'comic':
        kicker.textContent = 'Comic';
        box.className = 'card result-frame comic-result';
        ComicBook.mount(box, r);
        break;
      default:
        box.innerHTML = '<p class="muted" style="padding:1.5rem">No preview for this resource.</p>';
    }

    function setupEmbedFullscreen() {
      const wrap = document.getElementById('embedPlayer');
      const btn = document.getElementById('embedFsBtn');
      if (!wrap || !btn) return;

      const isFs = () =>
        document.fullscreenElement === wrap ||
        document.webkitFullscreenElement === wrap;

      const enter = () => {
        if (wrap.requestFullscreen) return wrap.requestFullscreen();
        if (wrap.webkitRequestFullscreen) return wrap.webkitRequestFullscreen();
      };

      const exit = () => {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      };

      const sync = () => {
        btn.textContent = isFs() ? '⛶ Exit fullscreen' : '⛶ Fullscreen';
        btn.setAttribute('aria-label', isFs() ? 'Exit fullscreen' : 'Enter fullscreen');
      };

      btn.addEventListener('click', () => {
        if (isFs()) exit();
        else enter();
      });

      document.addEventListener('fullscreenchange', sync);
      document.addEventListener('webkitfullscreenchange', sync);
    }
  </script>
</body>
</html>
